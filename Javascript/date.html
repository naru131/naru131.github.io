<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        
            <p id="day" style="padding-left: 30px; padding-bottom: 0px; font-size: 30px;">Sunday</p>
            <p><span id="hours" style="padding: 30px; color: red; font-size: 30px;">05</span> : <span id="minute" style="padding: 30px; color: red; font-size: 30px;">41</span> : <span id="second" style="padding: 30px; color: red; font-size: 30px;">42</span><span id="am_pm"> PM</span></p>
        
    
        <script>
            let todayDate = new Date();
    
    
            function getSeconds(){
                let myDate = new Date();
                let day = myDate.getDay();
                let hour = myDate.getHours();
                let minute = myDate.getMinutes();
                let second = myDate.getSeconds();
                let am_pm ;
    
                if(hour > 12){
    
                    hour -= 12;
                    am_pm = " PM "
                } 
                if(hour == 0){
    
                    hour = 12;
                    am_pm=" AM "
                } 
    
                hour = (hour<10) ? "0"+hour : hour;
                minute = (minute<10) ? "0"+minute : minute;
                second = (second<10) ? "0"+second : second;
    
                let dayname = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]
    
                document.getElementById('day').innerHTML = dayname[day];
                document.getElementById('hours').innerHTML = hour;
                document.getElementById('minute').innerHTML = minute;
                document.getElementById('second').innerHTML = second;
                document.getElementById('am_pm').innerHTML = am_pm;
                console.log(am_pm);
    
                
            }
    
            setInterval(getSeconds,1000);
    
    
        </script>
    
    </body>
</html>
